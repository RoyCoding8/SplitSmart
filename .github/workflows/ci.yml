name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v4
      - name: Test
        run: ./gradlew :app:testDebugUnitTest


  debug-apk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitSmart-PR-${{ github.event.pull_request.number }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v4
      - name: Check signing secrets
        env:
          STORE: ${{ secrets.SPLITSMART_STORE_FILE }}
          STORE_PW: ${{ secrets.SPLITSMART_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SPLITSMART_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SPLITSMART_KEY_PASSWORD }}
        run: |
          for v in STORE STORE_PW ALIAS KEY_PW; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is empty. Add the four SPLITSMART_* secrets under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
      - name: Decode keystore
        run: echo "${{ secrets.SPLITSMART_STORE_FILE }}" | base64 -d > /tmp/splitsmart.jks
      - name: Build release
        env:
          ORG_GRADLE_PROJECT_SPLITSMART_STORE_FILE: /tmp/splitsmart.jks
          ORG_GRADLE_PROJECT_SPLITSMART_STORE_PASSWORD: ${{ secrets.SPLITSMART_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SPLITSMART_KEY_ALIAS: ${{ secrets.SPLITSMART_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SPLITSMART_KEY_PASSWORD: ${{ secrets.SPLITSMART_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Name the APK
        # The asset name IS the download URL. Left as app-release.apk, a release
        # page offers a file that says nothing about which version it is and cannot
        # be linked to per version, so the README's download button has nothing to
        # point at. The version goes in the filename.
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SplitSmart-${{ github.ref_name }}.apk"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/SplitSmart-${{ github.ref_name }}.apk
          name: SplitSmart ${{ github.ref_name }}
          generate_release_notes: true
